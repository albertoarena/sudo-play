name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v3

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # The feature test renders the Blade layout, which needs the Vite manifest
      - name: Build assets
        run: npm run build

      - name: Tests
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: Code style
        run: composer lint

      - name: Component tests
        run: npm test

      - name: Type check
        run: npm run typecheck
